name: Test
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint mise-settings
        run: codebase lint:mise-settings "$PWD"
      - name: Lint shellcheck
        run: codebase lint:shellcheck "$PWD"
      - name: Lint gum-table
        run: codebase lint:gum-table "$PWD"