id: variadic-args-consumer
language: Bash
severity: hint
message: command may consume a variadic Usage value
rule:
  any:
    - all:
        - kind: command
        - has:
            kind: command_name
            regex: '^eval$'
            stopBy: neighbor
    - all:
        - kind: command
        - has:
            kind: command_name
            regex: '^read$'
            stopBy: neighbor
    - all:
        - kind: redirected_statement
        - has:
            all:
              - kind: command
              - has:
                  kind: command_name
                  regex: '^read$'
                  stopBy: neighbor
            stopBy: neighbor
        - has:
            any:
              - all:
                  - kind: heredoc_redirect
                  - not:
                      has:
                        kind: file_descriptor
                        stopBy: neighbor
              - all:
                  - kind: file_redirect
                  - regex: '^<[[:space:]]*<[[:space:]]*[(]'
            stopBy: end
