id: variadic-args-consumer
language: Bash
severity: hint
message: command may consume a variadic Usage value
rule:
  any:
    - all:
        - kind: command
        - has:
            kind: command_name
            regex: '^eval$'
            stopBy: neighbor
    - all:
        - kind: command
        - not:
            inside:
              kind: redirected_statement
              stopBy: end
        - has:
            kind: command_name
            regex: '^read$'
            stopBy: neighbor
    - all:
        - kind: redirected_statement
        - has:
            kind: command_name
            regex: '^read$'
            stopBy: end
