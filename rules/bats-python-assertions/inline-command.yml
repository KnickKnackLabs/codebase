id: bats-python-inline-command
language: Bash
severity: hint
message: inline Python command in a BATS test
rule:
  any:
    - pattern: $PYTHON -c $PROGRAM
    - pattern: run $PYTHON -c $PROGRAM
    - pattern: run $RUN_LAST $PYTHON -c $PROGRAM
    - pattern: run $RUN_OPTION_1 $RUN_LAST $PYTHON -c $PROGRAM
    - pattern: run $RUN_OPTION_1 $RUN_OPTION_2 $RUN_LAST $PYTHON -c $PROGRAM
    - pattern: run $RUN_OPTION_1 $RUN_OPTION_2 $RUN_OPTION_3 $RUN_LAST $PYTHON -c $PROGRAM
constraints:
  PYTHON:
    regex: '^python3?$'
  RUN_LAST:
    regex: '^(!|-(?:[0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])|--keep-empty-lines|--separate-stderr|--)$'
  RUN_OPTION_1: &run-option
    regex: '^(!|-(?:[0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])|--keep-empty-lines|--separate-stderr)$'
  RUN_OPTION_2: *run-option
  RUN_OPTION_3: *run-option
